
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asteroid-entry-dynamics"
version = "0.1.0"
description = "Numerical and differentiable simulation of asteroid atmospheric entry."
readme = "README.md"
requires-python = ">=3.12"

keywords = [
    "scientific-computing",
    "computational-physics",
    "numerical-methods",
    "atmospheric-entry",
    "differentiable-physics",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "numpydoc",
]

research = [
    "pandas",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
]

docs = [
    "sphinx",
    "numpydoc",
    "pydata-sphinx-theme",
    "sphinx-autobuild>=2025.8.25",
]

[tool.uv]
default-groups = ["dev", "research"]

[tool.hatch.build.targets.wheel]
packages = ["src/asteroid_entry"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: computationally expensive tests",
    "gpu: tests requiring GPU hardware",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # PEP 8 errors.
    "F",    # Pyflakes.
    "I",    # Import sorting.
    "UP",   # Python syntax modernisation.
    "B",    # Flake8-bugbear.
    "NPY",  # NumPy-specific checks.
    "D",    # Docstring conventions.
    "W291", # Trailing whitespace.
    "W292", # Missing newline at end of file.
    "W293", # Whitespace on blank lines.
    "W505", # Documentation line length.
]

ignore = [
    "E111", # Indentation handled by the formatter.
    "E114", # Comment indentation handled by the formatter.
    "E117", # Over-indentation handled by the formatter.
    "D206", # Docstring indentation handled by the formatter.
    "D300", # Docstring quotation handled by the formatter.
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 75

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 60

[tool.numpydoc_validation]
checks = [
    "all",
    "EX01", # Examples are not required for every documented object.
    "SA01", # See Also is not required for every documented object.
    "ES01", # Extended summaries are not always necessary.
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true

[tool.coverage.run]
source = ["asteroid_entry"]
branch = true

[tool.coverage.report]
show_missing = true
